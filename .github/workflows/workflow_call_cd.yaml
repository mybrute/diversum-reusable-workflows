name: Reusable - Kubernetes CD

on:
  workflow_call:
    inputs:
      environment:
        description: "Ambiente de destino"
        required: true
        type: string
      namespace:
        description: "Namespace Kubernetes"
        required: true
        type: string

      image:
        description: "Imagem Docker do Canary no GHCR"
        required: true
        type: string  

permissions:
  contents: read

jobs:
  check-kubernetes:
    name: Check Kubernetes - ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, diversum-cd]

    environment: ${{ inputs.environment }}
    
    concurrency:
      group: diversum-canary-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Check Kubernetes context
        run: kubectl config current-context

      - name: Check Kubernetes pods
        env:
          K8S_NAMESPACE: ${{ inputs.namespace }}
        run: kubectl get pods -n "$K8S_NAMESPACE"
      
      - name: Validate Canary image
        shell: bash
        env:
          CANARY_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          if [[ ! "$CANARY_IMAGE" =~ ^ghcr\.io/mybrute/canary:sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::Invalid Canary image: $CANARY_IMAGE"
            exit 1
          fi

          echo "Validated Canary image: $CANARY_IMAGE"
      
      - name: Deploy Canary
        shell: bash
        env:
          K8S_NAMESPACE: ${{ inputs.namespace }}
          CANARY_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          kubectl -n "$K8S_NAMESPACE" set image \
            deployment/canary \
            canary="$CANARY_IMAGE"

      - name: Wait for Canary rollout
        shell: bash
        env:
          K8S_NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail

          kubectl -n "$K8S_NAMESPACE" rollout status \
            deployment/canary \
            --timeout=180s
